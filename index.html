<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AlgoForge — a fully client-side path from beginner to expert in data structures, algorithms, and system design."
    />
    <title>AlgoForge</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem("algoforge-theme");
          var theme = "dark";
          if (raw) {
            var parsed = JSON.parse(raw);
            theme = (parsed && parsed.state && parsed.state.theme) || "dark";
          }
          var root = document.documentElement;
          if (theme === "light") root.classList.remove("dark");
          else root.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
